<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buddy Todo</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="sky"></div>
  <div id="birds"></div>

  <header>
    <h1>🐦 Buddy Todo</h1>
    <button id="enableBtn" class="btn">🔔 Enable sound &amp; notifications</button>
  </header>

  <main>
    <section class="card" id="formCard">
      <h2 id="formTitle">New task</h2>
      <form id="taskForm">
        <label>Task <input name="title" required maxlength="120" placeholder="Drink water, study, gym…"></label>
        <label>Note <input name="note" maxlength="500" placeholder="optional message"></label>

        <div class="row">
          <label>Buddy <select name="character"></select></label>
          <label>Attitude <select name="attitude"></select></label>
        </div>

        <div class="row">
          <label>Repeat
            <select name="stype">
              <option value="daily">Every day</option>
              <option value="weekly">Weekly (choose days)</option>
              <option value="once">Only once</option>
            </select>
          </label>
          <label>Time <input type="time" name="time" value="09:00" required></label>
        </div>

        <label id="dateRow" class="hidden">Date <input type="date" name="date"></label>
        <div id="daysRow" class="days hidden">
          <label><input type="checkbox" name="day" value="1">Mon</label>
          <label><input type="checkbox" name="day" value="2">Tue</label>
          <label><input type="checkbox" name="day" value="3">Wed</label>
          <label><input type="checkbox" name="day" value="4">Thu</label>
          <label><input type="checkbox" name="day" value="5">Fri</label>
          <label><input type="checkbox" name="day" value="6">Sat</label>
          <label><input type="checkbox" name="day" value="0">Sun</label>
        </div>

        <div class="row three">
          <label>Progress block (min) <input type="number" name="durationMin" min="1" value="25"></label>
          <label>"Later" (min) <input type="number" name="snoozeMin" min="1" value="10"></label>
          <label>Nag every (min, 0=off) <input type="number" name="nagMin" min="0" value="5"></label>
        </div>

        <label class="check"><input type="checkbox" name="enabled" checked> Enabled</label>

        <div class="row">
          <button class="btn primary" type="submit">Save task</button>
          <button class="btn" type="button" id="cancelEdit" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section id="list"></section>
  </main>

  <div id="modal" class="hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div id="mChar" class="char">🐱</div>
      <div id="mSay" class="bubble"></div>
      <h2 id="mTitle"></h2>
      <p id="mNote"></p>
      <div class="mbtns">
        <button id="mDone" class="btn ok">✅ Completed</button>
        <button id="mProg" class="btn warn">🚧 Start progress</button>
        <button id="mLater" class="btn">⏰ Later</button>
      </div>
      <div class="mins">
        <label>Work for <input id="mWorkMin" type="number" min="1" value="25"> min</label>
        <label>Remind again in <input id="mLaterMin" type="number" min="1" value="10"> min</label>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
